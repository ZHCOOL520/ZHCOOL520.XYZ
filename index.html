<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/images/favicon-64.webp" sizes="64x64" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <!-- 自托管字体（保底：加载失败自动回落系统字体，font-display: swap 不阻塞渲染） -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Variable.woff2" crossorigin>
    <title>ZHCOOL520 - 个人主页</title>
    <meta name="description" content="ZHCOOL520 的个人主页 - HarmonyOS & Android 开发者，Minecraft Mod & Plugin 创作者，热爱开源与技术创新。" />
    <meta name="keywords" content="ZHCOOL520, 开发者, HarmonyOS, Android, Minecraft, Mod, Plugin, 开源" />
    <meta name="author" content="ZHCOOL520" />
    <meta name="robots" content="index, follow" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZHCOOL520" />
    <meta property="og:image" content="https://zhcool520.xyz/images/fox.webp" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="zh_CN" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://zhcool520.xyz/images/fox.webp" />
  </head>
  <body class="antialiased transition-colors duration-300">
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
    <!-- SPA path recovery: restores the original path from 404.html redirect -->
    <script>
      (function(l) {
        var params = new URLSearchParams(l.search);
        var path = params.get('path');
        if (path) {
          window.history.replaceState(null, null, path);
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <!-- 保底：未开启 JavaScript 时给出一句可读的说明，而不是一片空白 -->
    <noscript>
      <div style="max-width:32rem;margin:15vh auto;padding:1.5rem;font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;line-height:1.7;color:#334155;text-align:center">
        <h1 style="font-size:1.25rem;margin-bottom:.75rem">需要开启 JavaScript</h1>
        <p style="font-size:.9rem">本站是单页应用，页面内容由浏览器端渲染。请在浏览器设置中开启 JavaScript 后刷新页面。</p>
        <p style="font-size:.9rem;margin-top:.75rem">也可以直接访问我的
          <a href="https://github.com/ZHCOOL520" style="color:#6366f1">GitHub</a> 或
          <a href="https://space.bilibili.com/1414910921" style="color:#6366f1">Bilibili</a>。
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
