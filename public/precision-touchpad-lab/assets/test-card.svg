<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Precision touchpad calibration card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#818cf8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity=".95"/>
    </linearGradient>
    <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <pattern id="grid5" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#334155" stroke-width="1.2"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="640" fill="url(#bg)"/>
  <rect width="800" height="640" fill="url(#grid1)"/>
  <rect width="800" height="640" fill="url(#grid5)"/>

  <!-- center graticule -->
  <g stroke="#64748b" stroke-width="1" opacity=".75">
    <line x1="400" y1="40" x2="400" y2="600"/>
    <line x1="40" y1="320" x2="760" y2="320"/>
    <circle cx="400" cy="320" r="80" fill="none"/>
    <circle cx="400" cy="320" r="160" fill="none"/>
    <circle cx="400" cy="320" r="240" fill="none" stroke-dasharray="4 8"/>
  </g>
  <line x1="330" y1="320" x2="470" y2="320" stroke="#f8fafc" stroke-width="2"/>
  <line x1="400" y1="250" x2="400" y2="390" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="400" cy="320" r="6" fill="#f8fafc" filter="url(#glow)"/>

  <!-- rotation reference: dashed spokes + tick ring -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 10" opacity=".85">
    <line x1="400" y1="320" x2="110" y2="42"/>
    <line x1="400" y1="320" x2="690" y2="42"/>
    <line x1="400" y1="320" x2="110" y2="598"/>
    <line x1="400" y1="320" x2="690" y2="598"/>
  </g>
  <g fill="#cbd5e1" font-family="Consolas, monospace" font-size="15">
    <text x="400" y="28" text-anchor="middle">0°</text>
    <text x="400" y="632" text-anchor="middle">180°</text>
    <text x="770" y="326" text-anchor="end">90°</text>
    <text x="30" y="326">−90°</text>
  </g>

  <!-- asymmetric quadrant markers (make rotation obvious) -->
  <g filter="url(#glow)">
    <circle cx="200" cy="160" r="26" fill="#22d3ee" opacity=".9"/>
    <rect x="580" y="134" width="52" height="52" rx="8" fill="#f472b6" opacity=".9"/>
    <polygon points="200,480 174,444 226,444" fill="#a3e635" opacity=".9"/>
    <circle cx="600" cy="470" r="30" fill="none" stroke="#fbbf24" stroke-width="6"/>
  </g>
  <g fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">
    <text x="200" y="215" text-anchor="middle">TL</text>
    <text x="606" y="215" text-anchor="middle">TR</text>
    <text x="200" y="525" text-anchor="middle">BL</text>
    <text x="600" y="525" text-anchor="middle">BR</text>
  </g>

  <!-- colour fringe bars: 1px alignment check -->
  <g>
    <rect x="60" y="560" width="680" height="10" fill="url(#sheen)"/>
    <g fill="#020617">
      <rect x="60" y="572" width="680" height="4"/>
    </g>
    <g fill="#f8fafc" font-family="Consolas, monospace" font-size="12">
      <text x="60" y="594">colour fringe</text>
      <text x="740" y="594" text-anchor="end">precision-touchpad-lab</text>
    </g>
  </g>

  <!-- corner brackets -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity=".8">
    <path d="M24 56V24h32"/>
    <path d="M776 56V24h-32"/>
    <path d="M24 584v32h32"/>
    <path d="M776 584v32h-32"/>
  </g>
  <text x="400" y="74" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" letter-spacing="4">PRECISION TOUCHPAD · CALIBRATION CARD</text>
</svg>
